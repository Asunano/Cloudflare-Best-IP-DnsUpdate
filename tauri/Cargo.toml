[package]
name = "cfopt-gui"
version = "0.1.0"
description = "cfopt 桌面端（Tauri v2 + Rust sidecar 桥接 Go 守护进程）"
authors = ["cfopt"]
edition = "2021"
rust-version = "1.77"

# 库名与 main.rs 中的 `cfopt_gui_lib::run()` 对应。
[lib]
name = "cfopt_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI 直通层的超时控制（tauri 已内置 tokio 运行时，这里只用 time 特性）。
tokio = { version = "1", features = ["time"] }

[features]
# 必须默认开启 custom-protocol，否则 Tauri 会以 dev 模式构建：
# 不嵌入前端、转而加载 devUrl(localhost:5173)，导致 “localhost 拒绝连接”。
# 该 feature 由 `cargo tauri build` 自动启用；裸 `cargo build` 也需要它。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
