[package]
name = "cfopt-gui"
version = "0.1.0"
description = "cfopt 桌面端（Tauri v2 + Rust sidecar 桥接 Go 守护进程）"
authors = ["cfopt"]
edition = "2021"
rust-version = "1.77"

# 库名与 main.rs 中的 `cfopt_gui_lib::run()` 对应。
[lib]
name = "cfopt_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI 直通层的超时控制（tauri 已内置 tokio 运行时，这里只用 time 特性）。
tokio = { version = "1", features = ["time"] }

[features]
# 默认关闭自定义协议；使用 Tauri 自带资产协议即可。
custom-protocol = ["tauri/custom-protocol"]
