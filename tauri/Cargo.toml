[package]
name = "cfopt-gui"
version = "0.1.0"
description = "cfopt 桌面端（Tauri v2 + Rust sidecar 桥接 Go 守护进程）"
authors = ["cfopt"]
edition = "2021"
rust-version = "1.77"

# 库名与 main.rs 中的 `cfopt_gui_lib::run()` 对应。
[lib]
name = "cfopt_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认关闭自定义协议；使用 Tauri 自带资产协议即可。
custom-protocol = ["tauri/custom-protocol"]
